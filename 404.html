<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>listatread</title>
    <script>
        (function () {
            var path = location.pathname + location.search + location.hash;
            try { sessionStorage.setItem('__redirect_path__', path); } catch (e) {}
            // Редирект на корень, чтобы GitHub Pages отдал index.html
            location.replace('/' + location.search + location.hash);
        })();
    </script>
</head>
<body></body>
</html>
